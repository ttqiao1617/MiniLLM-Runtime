name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tools
        run: python -m pip install --disable-pip-version-check bandit pip-audit

      - name: Scan tracked content and Git metadata
        run: python scripts/security_scan.py

      - name: Static analysis
        run: python -m bandit -r python -ll

      - name: Audit pinned dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Parse Python and JSON artifacts
        run: |
          python -m compileall -q python scripts/security_scan.py
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path("inputs").rglob("*.json"))
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"parsed {len(files)} JSON files")
          PY
